name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24.15.0

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - if: runner.os != 'Windows'
        run: chmod +x tests/fixtures/bin/codex
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - if: runner.os != 'Linux'
        run: npm run test:packaged

  cli:
    name: npm CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - if: runner.os != 'Windows'
        run: chmod +x tests/fixtures/bin/codex
      - run: npm run test:cli
      - run: npm run test:cli-package
      - run: npm run test:integration

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: chmod +x tests/fixtures/bin/codex
      - run: xvfb-run -a npm run test:vscode

  generated:
    name: Generated assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run protocol:generate
      - run: npm run icons:generate
      - run: git diff --exit-code -- src/shared/protocol/generated resources/icon.png
