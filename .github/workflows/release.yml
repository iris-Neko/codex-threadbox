name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      rpm_release_tag:
        description: Build and append RPM from this existing published desktop tag
        required: false
        type: string
      artifact_run_id:
        description: Reuse fully tested desktop artifacts from this run (optional)
        required: false
        type: string
      release_tag:
        description: Existing desktop tag for verified-artifact publication
        required: false
        type: string
  push:
    tags:
      - 'v[0-9]*'

env:
  NODE_VERSION: 24.15.0

jobs:
  desktop:
    if: ${{ !inputs.artifact_run_id && !inputs.rpm_release_tag }}
    name: Desktop ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            args: --win --x64
          - target: macos-x64-arm64
            os: macos-latest
            args: --mac --x64 --arm64
          - target: linux-x64
            os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - if: runner.os != 'Windows'
        run: chmod +x tests/fixtures/bin/codex
      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: npm run verify
      - run: npm run test:integration
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Install Flatpak build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils rpm
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - run: npm run dist -- ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Install and smoke-test Flatpak
        if: runner.os == 'Linux'
        run: |
          flatpak install --user --assumeyes --bundle dist/*.flatpak
          dbus-run-session -- xvfb-run -a node scripts/smoke-flatpak.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.flatpak
            dist/*.rpm

  rpm-addon:
    name: Build and publish RPM add-on
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rpm_release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.rpm_release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Require an existing stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false)' | grep -q 'isDraft'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rpm_release_tag }}
          path: source
      - run: npm ci
      - run: npm ci
        working-directory: source
      - name: Verify source version and build from the immutable tag
        working-directory: source
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          chmod +x tests/fixtures/bin/codex
          npm run verify
          sudo apt-get update
          sudo apt-get install -y rpm cpio
          npx electron-builder --linux rpm --x64 --publish never
      - name: Verify RPM metadata and extracted payload
        working-directory: source
        run: |
          set -euo pipefail
          RPM=$(realpath dist/*.rpm)
          test "$(rpm -qp --queryformat '%{VERSION}' "$RPM")" = "${RELEASE_TAG#v}"
          test "$(rpm -qp --queryformat '%{ARCH}' "$RPM")" = x86_64
          rpm --checksig "$RPM"
          mkdir dist/rpm-payload
          (cd dist/rpm-payload && rpm2cpio "$RPM" | cpio -idm)
          PAYLOAD=$(find dist/rpm-payload -type f -name threadbox-for-codex -print -quit)
          test -n "$PAYLOAD"
          cmp dist/linux-unpacked/resources/app.asar "$(dirname "$PAYLOAD")/resources/app.asar"
          sudo chown root:root "$(dirname "$PAYLOAD")/chrome-sandbox"
          sudo chmod 4755 "$(dirname "$PAYLOAD")/chrome-sandbox"
          THREADBOX_PACKAGED_EXECUTABLE=$(realpath "$PAYLOAD") xvfb-run -a node ../scripts/smoke-packaged.mjs
      - name: Verify installation on Fedora
        working-directory: source
        run: |
          docker run --rm -v "$PWD/dist:/artifacts:ro" fedora:latest sh -lc 'dnf -y install /artifacts/*.rpm && rpm -q codex-threadbox'
      - name: Publish RPM and update checksums without replacing existing installers
        run: node scripts/publish-desktop-rpm.mjs source/dist
        env:
          GH_TOKEN: ${{ github.token }}

  draft-release:
    name: Create draft GitHub Release
    needs: desktop
    if: ${{ always() && !inputs.rpm_release_tag && ((startsWith(github.ref, 'refs/tags/') && needs.desktop.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')) }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SOURCE_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifact source matches the tag and passed all platform jobs
        run: node scripts/verify-desktop-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: release-artifacts
          merge-multiple: true
      - name: Normalize Linux architecture names
        run: node scripts/normalize-desktop-artifacts.mjs release-artifacts
      - name: Generate checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Verify all requested platforms are present
        run: node scripts/verify-desktop-release.mjs release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: Threadbox Desktop ${{ env.RELEASE_TAG }}
          body_path: docs/releases/desktop-1.0.0.md
          files: release-artifacts/*

  finalize-release:
    name: Publish GitHub Release
    needs: draft-release
    if: ${{ always() && needs.draft-release.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
